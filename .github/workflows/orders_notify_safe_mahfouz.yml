name: Orders Notify Safe (Mahfouz)

on:
  push:
    branches: ["main"]
    paths:
      - "orders.json"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Do not send notifications or write markers"
        required: true
        default: "true"

permissions:
  contents: write

concurrency:
  group: mahfouz-order-notify-safe
  # Order notifications are loss-sensitive. Queue runs instead of cancelling
  # older ones, otherwise a fast Medawar update can cancel a Geitawi new-order
  # run before Firebase sends it.
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # HEAD + parent is enough for push diffs and much faster than
          # checking out the full products repository history.
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install deps
        run: npm i firebase-admin@14

      - name: Send guarded notifications
        id: notify
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ORDERS_PATH: "orders.json"
          BRAND_ID: "mahfouz_market"
          RECENT_WINDOW_HOURS: "12"
          TIMER_LOOKBACK_HOURS: "24"
          # Orders/statuses before this deployment were already handled by the legacy notifier.
          TIMER_RECEIPTS_SINCE: "2026-08-26T13:16:47Z"
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: node .github/scripts/orders_notify_safe.js

      - name: Commit timer notification markers
        if: steps.notify.outputs.orders_changed == 'true'
        run: |
          git config user.name "mahfouz-notify-bot"
          git config user.email "mahfouz-notify-bot@users.noreply.github.com"
          git add orders.json
          git commit -m "Mark Mahfouz order timer alerts"
          git push
