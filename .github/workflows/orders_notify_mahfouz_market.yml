name: Orders Notify (mahfouz_market)

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "orders.json"

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for diff)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm i firebase-admin@12

      - name: Notify manager + delivery + escalation
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ORDERS_PATH: "orders.json"
          BRAND_ID: "mahfouz_market"
        run: |
          cat > notify.js <<'EOF'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const admin = require('firebase-admin');

          const sleep = (ms) => new Promise(r => setTimeout(r, ms));

          function gitShow(ref, path) {
            try { return execFileSync('git', ['show', `${ref}:${path}`], { encoding: 'utf8' }); }
            catch { return null; }
          }

          function normalizeBranch(branch) {
            const b = String(branch || '').trim().toLowerCase();
            if (b.includes('geitawi') || b.includes('ashrafieh') || b.includes('achrafieh') || b.startsWith('g')) return 'geitawi';
            if (b.includes('medawar') || b.includes('karantina') || b.startsWith('m')) return 'medawar';
            return 'unknown';
          }

          function prettyBranch(slug) {
            if (slug === 'geitawi') return 'Geitawi';
            if (slug === 'medawar') return 'Medawar';
            return slug;
          }

          function keyOf(o) { return String(o?.orderId || o?.id || o?.ts || ''); }
          function statusOf(o) { return String(o?.status || 'NEW').toUpperCase(); }
          function safeStr(v) { return v == null ? '' : String(v); }

          function fmtUsd(v) {
            const n = Number(v || 0);
            return n.toFixed(2);
          }

          function pickCustomerName(o) {
            const c = o.customer || {};
            const name =
              String(c.name || '').trim() ||
              String(c.fullName || '').trim() ||
              String(o.customerName || '').trim() ||
              String(o.name || '').trim();
            return name || 'Customer';
          }

          function shortAddrFromOrder(o) {
            const c = o.customer || {};
            const raw = String(c.address || '').trim();
            if (!raw) return '';
            const line1 = raw.split('\n')[0].trim();
            return line1.length > 80 ? line1.slice(0, 80) + '…' : line1;
          }

          // Firebase init
          const saRaw = process.env.FIREBASE_SERVICE_ACCOUNT_JSON;
          if (!saRaw) throw new Error('Missing secret: FIREBASE_SERVICE_ACCOUNT_JSON');

          const sa = JSON.parse(saRaw);

          // ✅ FIX: normalize \n in private_key
          if (sa.private_key && typeof sa.private_key === 'string') {
            sa.private_key = sa.private_key.replace(/\\n/g, '\n');
          }

          admin.initializeApp({ credential: admin.credential.cert(sa) });

          async function sendToTopic(topic, title, body, data = {}) {
            const msg = {
              topic,
              notification: { title, body },
              data: Object.fromEntries(Object.entries(data).map(([k, v]) => [k, v == null ? '' : String(v)])),
              android: { priority: 'high', notification: { sound: 'default' } },
              apns: { headers: { 'apns-priority': '10' } },
            };
            const id = await admin.messaging().send(msg);
            console.log(`✅ Sent to topic=${topic} msgId=${id}`);
          }

          // Load orders + diff
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const before = event.before;
          const filePath = process.env.ORDERS_PATH;

          const currText = fs.readFileSync(filePath, 'utf8');
          const currJson = JSON.parse(currText);
          const currOrders = Array.isArray(currJson) ? currJson : (currJson.orders || []);

          const prevText = (before && !String(before).startsWith('0000000')) ? gitShow(before, filePath) : null;
          let prevOrders = [];
          if (prevText) {
            const prevJson = JSON.parse(prevText);
            prevOrders = Array.isArray(prevJson) ? prevJson : (prevJson.orders || []);
          }

          const prevByKey = new Map(prevOrders.map(o => [keyOf(o), o]));
          const prevKeys = new Set(prevOrders.map(keyOf).filter(Boolean));

          const newOrders = currOrders.filter(o => {
            const k = keyOf(o);
            return k && !prevKeys.has(k);
          });

          // ✅ detect newly ASSIGNED_DRIVER (transition)
          const assignedNow = currOrders.filter(o => {
            const k = keyOf(o);
            if (!k) return false;
            if (statusOf(o) !== 'ASSIGNED_DRIVER') return false;
            const prev = prevByKey.get(k);
            return !prev || statusOf(prev) !== 'ASSIGNED_DRIVER';
          });

          console.log(`🔎 new orders detected: ${newOrders.length}`);
          console.log(`🔎 newly ASSIGNED_DRIVER detected: ${assignedNow.length}`);

          const brandId = process.env.BRAND_ID || 'mahfouz_market';

          (async () => {
            // ✅ NEW -> manager topic ONLY (NO orderId in title/body)
            for (const o of newOrders) {
              const branch = normalizeBranch(o.branch);
              const managerTopic = `orders_${brandId}_${branch}`;

              const name = pickCustomerName(o);
              const addr = shortAddrFromOrder(o);
              const totalUsd = fmtUsd(o.totalUsd);

              const title = `${prettyBranch(branch)} • ${name}`;
              const body  = `$${totalUsd}${addr ? ' • ' + addr : ''}`;

              await sendToTopic(managerTopic, title, body, {
                kind: 'new_order',
                brandId,
                branch,
                orderId: safeStr(o.orderId), // ✅ keep only in data
                customerName: name,
                totalUsd,
                address: String((o.customer || {}).address || ''),
                location: String((o.customer || {}).location || ''),
              });
            }

            // ✅ Delivery assigned notification (NO orderId in title/body)
            for (const o of assignedNow) {
              const branch = normalizeBranch(o.branch);
              const deliveryTopic = `deliveries_${brandId}_${branch}`;

              const name = pickCustomerName(o);
              const addr = shortAddrFromOrder(o);
              const totalUsd = fmtUsd(o.totalUsd);

              const title = `${prettyBranch(branch)} • ${name}`;
              const body  = `$${totalUsd}${addr ? ' • ' + addr : ''}`;

              await sendToTopic(deliveryTopic, title, body, {
                kind: 'delivery_assigned',
                brandId,
                branch,
                orderId: safeStr(o.orderId), // ✅ data only
                customerName: name,
                totalUsd,
                address: String((o.customer || {}).address || ''),
                location: String((o.customer || {}).location || ''),
              });
            }

            // ✅ wait 5 minutes then escalate if still NEW
            if (newOrders.length) {
              await sleep(5 * 60 * 1000);
              execFileSync('git', ['fetch', 'origin', 'main'], { stdio: 'inherit' });

              const latestText = gitShow('origin/main', filePath) || currText;
              const latestJson = JSON.parse(latestText);
              const latestOrders = Array.isArray(latestJson) ? latestJson : (latestJson.orders || []);
              const byKey = new Map(latestOrders.map(o => [keyOf(o), o]));

              for (const o of newOrders) {
                const latest = byKey.get(keyOf(o));
                if (!latest) continue;

                if (statusOf(latest) === 'NEW') {
                  const branch = normalizeBranch(latest.branch);
                  const escalationTopic = `owner_escalations_market_${branch}`;

                  const name = pickCustomerName(latest);
                  const addr = shortAddrFromOrder(latest);
                  const totalUsd = fmtUsd(latest.totalUsd);

                  const title = `⚠️ ${prettyBranch(branch)} • ${name}`;
                  const body  = `Not taken in 5 min • $${totalUsd}${addr ? ' • ' + addr : ''}`;

                  await sendToTopic(escalationTopic, title, body, {
                    kind: 'escalation_not_taken_5m',
                    brandId,
                    branch,
                    orderId: safeStr(latest.orderId), // ✅ data only
                    customerName: name,
                    totalUsd,
                  });
                }
              }
            }
          })().catch(err => { console.error(err); process.exit(1); });
          EOF

          node notify.js
