      - name: Notify managers + owner, then escalate after 5 minutes if still NEW
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          ORDERS_PATH: "orders.json"
          BRAND_ID: "mahfouz_market"
          OWNER_TOPIC: "owner_all_orders"
        run: |
          cat > notify.js <<'EOF'
          const fs = require('fs');
          const { execFileSync } = require('child_process');
          const admin = require('firebase-admin');

          const sleep = (ms) => new Promise(r => setTimeout(r, ms));

          function gitShow(ref, path) {
            try { return execFileSync('git', ['show', `${ref}:${path}`], { encoding: 'utf8' }); }
            catch { return null; }
          }

          function normalizeBranch(branch) {
            const b = String(branch || '').trim().toLowerCase();
            if (b.startsWith('g')) return 'geitawi';
            if (b.startsWith('m')) return 'medawar';
            return b.replace(/\s+/g, '_') || 'unknown';
          }

          function keyOf(o) {
            return String(o?.orderId || o?.id || o?.ts || '');
          }

          function statusOf(o) {
            return String(o?.status || 'NEW').toUpperCase();
          }

          function safe(v) {
            return v == null ? '' : String(v);
          }

          const saRaw = process.env.FIREBASE_SERVICE_ACCOUNT_JSON;
          if (!saRaw) throw new Error('Missing FIREBASE_SERVICE_ACCOUNT_JSON');
          const sa = JSON.parse(saRaw);

          admin.initializeApp({ credential: admin.credential.cert(sa) });

          async function sendToTopic(topic, title, body, data = {}) {
            const msg = {
              topic,
              notification: { title, body },
              data: Object.fromEntries(Object.entries(data).map(([k,v]) => [k, safe(v)])),
            };
            await admin.messaging().send(msg);
          }

          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8'));
          const before = event.before;
          const filePath = process.env.ORDERS_PATH;

          const currJson = JSON.parse(fs.readFileSync(filePath, 'utf8'));
          const currOrders = Array.isArray(currJson) ? currJson : (currJson.orders || []);

          const prevText = (before && !before.startsWith('0000000')) ? gitShow(before, filePath) : null;
          const prevOrders = prevText
            ? (Array.isArray(JSON.parse(prevText)) ? JSON.parse(prevText) : (JSON.parse(prevText).orders || []))
            : [];

          const prevKeys = new Set(prevOrders.map(keyOf));
          const newOrders = currOrders.filter(o => !prevKeys.has(keyOf(o)));

          if (!newOrders.length) process.exit(0);

          (async () => {
            for (const o of newOrders) {
              const branch = normalizeBranch(o.branch);
              await sendToTopic(
                `orders_${process.env.BRAND_ID}_${branch}`,
                '🛒 New Order',
                `Order ${safe(o.orderId)}`
              );
            }
          })().catch(err => {
            console.error(err);
            process.exit(1);
          });
          EOF

          node notify.js
