name: Push Ping (mahfouz)

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "FCM Topic (used if token is empty)"
        required: false
        default: "orders_mahfouz_market_geitawi"
      token:
        description: "Optional FCM Token (if set, overrides topic)"
        required: false
        default: ""
      title:
        description: "Notification title"
        required: false
        default: "PING (Mahfouz)"
      body:
        description: "Notification body"
        required: false
        default: "Hello from GitHub Actions (mahfouz)"
      apns_topic:
        description: "Optional iOS apns-topic (bundle id). Example: mahfouz.market.mm-app"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install deps
        run: npm i firebase-admin@12

      - name: Send ping
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          PING_TOPIC: ${{ inputs.topic }}
          PING_TOKEN: ${{ inputs.token }}
          PING_TITLE: ${{ inputs.title }}
          PING_BODY: ${{ inputs.body }}
          APNS_TOPIC: ${{ inputs.apns_topic }}
        run: node .github/scripts/push_ping.js
